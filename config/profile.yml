# Profile Configuration — [YOUR_NAME]
# EDIT THIS FILE FIRST — All other configs derive from here

name: "[YOUR_FULL_NAME]"
email: "[YOUR_EMAIL]"
phone: "[YOUR_PHONE_NUMBER]"
location: "[YOUR_CITY], [YOUR_STATE] ([YOUR_METRO_AREA])"
linkedin_url: "https://linkedin.com/in/[YOUR_LINKEDIN_HANDLE]"
linkedin_display: "linkedin.com/in/[YOUR_LINKEDIN_HANDLE]"
portfolio_url: "https://github.com/[YOUR_GITHUB_HANDLE]"
portfolio_display: "github.com/[YOUR_GITHUB_HANDLE]"

# Target roles — EDIT: Replace with your actual target job titles
target_roles:
  - "[PRIMARY_ROLE_1]"
  - "[PRIMARY_ROLE_2]"
  - "[PRIMARY_ROLE_3]"
  - "[SECONDARY_ROLE_1]"
  - "[SECONDARY_ROLE_2]"

# Geography — EDIT: Replace with your actual metro area
geo_preferences:
  - "[YOUR_METRO_AREA]"
  - "Remote (US)"

# Compensation strategy
compensation:
  strategy: "flexible"
  note: "Optimize for [YOUR_PRIORITY]"

# PDF generation threshold
auto_pdf_score_threshold: 4.0

# Job search fine-tuning
search:
  titles:
    - "[SEARCH_TITLE_1]"
    - "[SEARCH_TITLE_2]"
    - "[SEARCH_TITLE_3]"
  locations:
    - "[YOUR_METRO]"
    - "Remote"
    - "[YOUR_STATE]"
  exclude_titles:
    - "Intern"
    - "Junior"
    - "Entry Level"
    - "Associate"

# Archetype definitions
archetypes:
  - name: "[ARCHETYPE_1_NAME]"
    signals:
      - "[keyword1]"
      - "[keyword2]"
    fit: "[Your fit description]"
  - name: "[ARCHETYPE_2_NAME]"
    signals:
      - "[keyword1]"
      - "[keyword2]"
    fit: "[Your fit description]"
