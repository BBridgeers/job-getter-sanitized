# Profile Configuration — Template (fill in your details)

name: "YOUR_NAME"
email: "your.email@example.com"
phone: "(XXX) XXX-XXXX"
location: "YOUR_CITY, STATE (METRO_AREA)"
linkedin_url: "https://linkedin.com/in/yourusername"
linkedin_display: "linkedin.com/in/yourusername"
portfolio_url: "https://github.com/yourusername"
portfolio_display: "github.com/yourusername"

# Target roles
target_roles:
  - "Customer Success Executive"
  - "Account Manager"
  - "Implementation Consultant"
  - "Client Partner"
  - "Strategic Account Executive"

# Geography
geo_preferences:
  - "YOUR_METRO_AREA"
  - "Remote (US)"

# Compensation
compensation:
  strategy: "flexible"
  note: "Optimize for the right role/title, money follows"

# PDF generation threshold
auto_pdf_score_threshold: 4.0

# Job search config
search:
  titles:
    - "Customer Success Executive"
    - "Customer Success Manager"
    - "Account Manager"
    - "Implementation Consultant"
    - "Client Partner"
    - "Strategic Account Executive"
    - "Customer Success Director"
    - "Senior Account Manager"
    - "Client Executive"
    - "Account Executive"
  locations:
    - "YOUR_METRO_AREA"
    - "Remote"
    - "YOUR_STATE"
  exclude_titles:
    - "Intern"
    - "Junior"
    - "Entry Level"
    - "Associate"
    - "Part-time"

# Archetype definitions (adapt for your background)
archetypes:
  - name: "AI Transformation"
    signals: ["change management", "adoption", "enablement", "transformation"]
    fit: "describe your fit here"
  - name: "AI Forward Deployed"
    signals: ["client-facing", "deploy", "prototype", "fast delivery", "field"]
    fit: "describe your fit here"
  - name: "Technical AI PM"
    signals: ["PRD", "roadmap", "discovery", "stakeholder", "product manager"]
    fit: "describe your fit here"